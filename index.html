<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Million Pixel Canvas</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#viewport{
    position:absolute;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    overflow:auto;
    background:white;
}

#canvas{
    display:block;
    image-rendering:pixelated;
}

#toolbar{
    position:fixed;
    top:10px;
    left:10px;
    z-index:100;
    background:white;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

#loginPopup{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:white;
    border:2px solid black;
    padding:20px;
    border-radius:8px;
    z-index:1000;
    width:280px;
}

#loginPopup input{
    width:100%;
    margin-bottom:10px;
    padding:8px;
    box-sizing:border-box;
}

#overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:999;
}

button{
    padding:8px;
    cursor:pointer;
}

</style>
</head>
<body>

<div id="toolbar">
    <input type="color" id="color" value="#000000">
</div>

<div id="overlay"></div>

<div id="loginPopup">

    <h3>Login Required</h3>

    <input
        id="email"
        type="email"
        placeholder="Email">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <button id="signup">
        Sign Up
    </button>

    <button id="login">
        Login
    </button>

</div>

<div id="viewport">
    <canvas id="canvas"></canvas>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
