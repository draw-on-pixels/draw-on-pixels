<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Million Pixel Canvas</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#canvas {
    width: 100vw;
    height: 100vh;
    display: block;
    image-rendering: pixelated;
    cursor: crosshair;
}

#toolbar {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: white;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

#loginPopup {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border: 2px solid black;
    padding: 20px;
    border-radius: 8px;
    min-width: 250px;
}

#loginPopup input {
    width: 100%;
    margin-bottom: 10px;
    box-sizing: border-box;
    padding: 8px;
}

#overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 999;
}
</style>
</head>
<body>

<div id="toolbar">
    <input type="color" id="color" value="#000000">
</div>

<div id="overlay"></div>

<div id="loginPopup">
    <h3>Login Required</h3>

    <input
        id="email"
        type="email"
        placeholder="Email">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <button id="signup">
        Sign Up
    </button>

    <button id="login">
        Login
    </button>
</div>

<canvas id="canvas"></canvas>

<!-- Supabase Library -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<!-- Your App Code -->
<script src="app.js?v=4"></script>

</body>
</html>
